[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dunia-cohere-workshops"
version = "0.1.0"
description = "Dunia Hub's Cohere workshop and open research series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cohere>=5.20,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]