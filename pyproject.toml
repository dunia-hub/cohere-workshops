[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dunia-cohere-workshops"
version = "0.1.0"
description = "Dunia Hub's Cohere workshop and open research series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cohere>=5.20,<6",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
cohere-workshops = "cohere_workshops.cli:main"
cohere-dataset = "cohere_workshops.dataset_cli:main"
cohere-case = "cohere_workshops.case_cli:main"
cohere-search = "cohere_workshops.semantic_cli:main"
cohere-versions = "cohere_workshops.version_cli:main"
cohere-demo-repo = "cohere_workshops.demo_repo:main"
cohere-rerank = "cohere_workshops.rerank_cli:main"
cohere-agent = "cohere_workshops.agent_cli:main"
cohere-candidates = "cohere_workshops.candidates_cli:main"
